<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Pipe Panic - animated banner" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#1b1140"/>
      <stop offset="1" stop-color="#2a0f3a"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="0.5" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#fb923c"/>
    </linearGradient>
    <radialGradient id="ball" cx="0.35" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#fff7cc"/>
      <stop offset="0.5" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#b45309"/>
    </radialGradient>
    <radialGradient id="gem" cx="0.35" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#d1fae5"/>
      <stop offset="0.5" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#166534"/>
    </radialGradient>
    <radialGradient id="trap" cx="0.35" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#fecaca"/>
      <stop offset="0.5" stop-color="#ef4444"/>
      <stop offset="1" stop-color="#7f1d1d"/>
    </radialGradient>
    <filter id="glow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.045"/>
    </pattern>
  </defs>

  <rect width="1200" height="340" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="18" fill="url(#grid)"/>

  <g fill="#ffffff">
    <circle cx="90" cy="60" r="1.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="210" cy="110" r="1.2"><animate attributeName="opacity" values="1;0.2;1" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="330" cy="45" r="1.8"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="930" cy="55" r="1.5"><animate attributeName="opacity" values="1;0.2;1" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="1040" cy="120" r="1.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="1130" cy="50" r="1.7"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="150" cy="190" r="1.1"><animate attributeName="opacity" values="1;0.3;1" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="1090" cy="200" r="1.3"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.2s" repeatCount="indefinite"/></circle>
  </g>

  <text x="600" y="48" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="600" letter-spacing="6" fill="#94a3b8">3D MAZE PUZZLE  ·  C++  ·  OPENGL</text>
  <text x="600" y="136" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="88" font-weight="800" letter-spacing="10" fill="url(#title)">PIPE PANIC</text>
  <text x="600" y="184" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="24" letter-spacing="2" fill="#c7d2fe">A glowing ball. A twisting 3D maze. One way out.</text>

  <g fill="none" stroke-linejoin="round" stroke-linecap="round">
    <path d="M 430 295 V 322" stroke="#7dd3fc" stroke-opacity="0.35" stroke-width="40"/>
    <path d="M 830 252 V 215" stroke="#7dd3fc" stroke-opacity="0.35" stroke-width="40"/>
    <path d="M 40 290 H 250 V 250 H 430 V 295 H 640 V 252 H 830 V 292 H 1010 V 255 H 1160" stroke="#7dd3fc" stroke-opacity="0.35" stroke-width="40"/>

    <path d="M 430 295 V 322" stroke="#04060c" stroke-opacity="0.75" stroke-width="32"/>
    <path d="M 830 252 V 215" stroke="#04060c" stroke-opacity="0.75" stroke-width="32"/>
    <path d="M 40 290 H 250 V 250 H 430 V 295 H 640 V 252 H 830 V 292 H 1010 V 255 H 1160" stroke="#04060c" stroke-opacity="0.75" stroke-width="32"/>

    <path d="M 40 290 H 250 V 250 H 430 V 295 H 640 V 252 H 830 V 292 H 1010 V 255 H 1160" stroke="#ffffff" stroke-opacity="0.16" stroke-width="3" transform="translate(0,-9)"/>
  </g>

  <g fill="none" stroke="#000000" stroke-opacity="0.8" stroke-width="2">
    <ellipse cx="250" cy="270" rx="5" ry="16"/>
    <ellipse cx="430" cy="272" rx="5" ry="16"/>
    <ellipse cx="640" cy="274" rx="5" ry="16"/>
    <ellipse cx="830" cy="272" rx="5" ry="16"/>
    <ellipse cx="1010" cy="274" rx="5" ry="16"/>
  </g>

  <circle cx="430" cy="322" r="11" fill="url(#trap)" filter="url(#glow)">
    <animate attributeName="r" values="9;13;9" dur="1.3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="830" cy="215" r="11" fill="url(#trap)" filter="url(#glow)">
    <animate attributeName="r" values="13;9;13" dur="1.3s" repeatCount="indefinite"/>
  </circle>

  <circle cx="1160" cy="255" r="14" fill="url(#gem)" filter="url(#glow)">
    <animate attributeName="r" values="11;17;11" dur="1.6s" repeatCount="indefinite"/>
  </circle>

  <g filter="url(#glow)">
    <circle r="6" fill="#fb923c" opacity="0.30">
      <animateMotion dur="9s" begin="-0.45s" repeatCount="indefinite" path="M 40 290 H 250 V 250 H 430 V 295 H 640 V 252 H 830 V 292 H 1010 V 255 H 1160"/>
    </circle>
    <circle r="8" fill="#fb923c" opacity="0.45">
      <animateMotion dur="9s" begin="-0.30s" repeatCount="indefinite" path="M 40 290 H 250 V 250 H 430 V 295 H 640 V 252 H 830 V 292 H 1010 V 255 H 1160"/>
    </circle>
    <circle r="10" fill="#fbbf24" opacity="0.65">
      <animateMotion dur="9s" begin="-0.15s" repeatCount="indefinite" path="M 40 290 H 250 V 250 H 430 V 295 H 640 V 252 H 830 V 292 H 1010 V 255 H 1160"/>
    </circle>
    <circle r="12" fill="url(#ball)">
      <animateMotion dur="9s" repeatCount="indefinite" path="M 40 290 H 250 V 250 H 430 V 295 H 640 V 252 H 830 V 292 H 1010 V 255 H 1160"/>
    </circle>
  </g>
</svg>
